<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFAF5"/>
      <stop offset="1" stop-color="#EFEADC"/>
    </linearGradient>
    <radialGradient id="komorebi" cx="0.34" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#E0B457" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#E0B457" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 和紙の板。macOS は角丸マスクを掛けないので自分で丸める -->
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#bark)"/>
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#komorebi)"/>

  <!-- 年輪。外へ行くほど淡くする -->
  <g fill="none" stroke="#2E7D4F" stroke-linecap="round">
    <circle cx="512" cy="512" r="300" stroke-width="26" opacity="0.20"/>
    <circle cx="512" cy="512" r="228" stroke-width="26" opacity="0.34"/>
    <circle cx="512" cy="512" r="156" stroke-width="26" opacity="0.52"/>
  </g>
  <circle cx="512" cy="512" r="60" fill="#2E7D4F"/>

  <!-- 差分の印。年輪を貫いて + と - を置く -->
  <g stroke="#2E7D4F" stroke-width="34" stroke-linecap="round">
    <path d="M700 356 H812"/>
    <path d="M756 300 V412"/>
  </g>
  <g stroke="#C0442E" stroke-width="34" stroke-linecap="round">
    <path d="M212 668 H324"/>
  </g>
</svg>
