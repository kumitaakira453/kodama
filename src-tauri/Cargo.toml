[package]
name = "kodama"
version = "0.1.0"
description = "worktree 対応の diff レビューアプリ"
authors = ["汲田 晶"]
edition = "2021"

[lib]
name = "kodama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
log = "0.4"
similar = { version = "3", features = ["unicode"] }
# 既定の Oniguruma は C ライブラリを引いてビルドが伸びる。fancy-regex は純 Rust。
syntect = { version = "5", default-features = false, features = [
  "default-fancy",
] }
notify = "8"
notify-debouncer-full = "0.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# git 呼び出しの仲介が中心なので、実行時最適化よりコンパイルの速さを優先する。
[profile.release]
opt-level = 1
codegen-units = 256
lto = false
incremental = false
strip = true

# 行内差分の計算だけは実行速度が要る。依存 1 個なのでビルド時間への影響が小さい。
[profile.release.package.similar]
opt-level = 3
